<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3ec" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Страница не найдена — FIXORA HOME</title>
    <style>
      *{box-sizing:border-box}
      body{display:grid;min-height:100svh;margin:0;padding:24px;place-items:center;background:#f5f3ec;color:#202d28;font-family:Manrope,Arial,sans-serif}
      main{width:min(100%,560px);text-align:center}
      .brand{margin:0 0 54px;font-size:15px;font-weight:800;letter-spacing:-.5px}
      .brand span{color:#a6c93f}
      .code{margin:0;color:#a6c93f;font-size:clamp(88px,22vw,150px);font-weight:800;line-height:.85;letter-spacing:-.09em}
      h1{margin:28px 0 12px;font-size:clamp(26px,6vw,38px);letter-spacing:-.06em}
      p{max-width:390px;margin:0 auto;color:rgb(32 45 40 / 66%);font-size:14px;line-height:1.8}
      a{display:inline-flex;min-height:52px;align-items:center;justify-content:center;margin-top:32px;padding:0 26px;border-radius:999px;background:#d7f36a;color:#202d28;font-size:13px;font-weight:800;text-decoration:none;transition:background .2s ease,transform .2s ease}
      a:hover{transform:translateY(-2px);background:#c8e85a}
      a:focus-visible{outline:3px solid #789c35;outline-offset:4px}
      @media(prefers-reduced-motion:reduce){a{transition:none}}
    </style>
  </head>
  <body>
    <main>
      <p class="brand">FIXORA <span>HOME</span></p>
      <p class="code" aria-label="Ошибка 404">404</p>
      <h1>Кажется, здесь пока пусто</h1>
      <p>Страница не найдена или адрес изменился. Вернитесь на главную — поможем сориентироваться.</p>
      <a href="/fixora-home/">Вернуться на главную</a>
    </main>
  </body>
</html>
